name: Update Umamusume Race List

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape GameTora race list
        run: python .github/scripts/scrape_racelist.py --dump

      - name: Upload debug snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racelist-debug
          path: racelist_debug/
          if-no-files-found: ignore

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LilyAiGameSpace/Umamusume/Guide/RaceList/Racelist.md
          git diff --cached --quiet || (git commit -m "chore: update Umamusume race list" && git push)
