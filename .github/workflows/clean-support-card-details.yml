name: Clean support card details

# Re-cleans the scraped *-Details.md files whenever they change on main
# (e.g. after the wiki scraper is re-run) and can be started by hand from the
# Actions tab. The script is idempotent, so a run on already clean files makes
# no commit.
#
# NOTE: the chore/clean-support-card-details entry below is only there so the
# workflow runs on the PR branch before it exists on main. Delete that line
# after merging.
on:
  push:
    branches:
      - main
      - chore/clean-support-card-details
    paths:
      - "LilyAiGameSpace/Umamusume/Support Cards/*-Details.md"
      - "tools/clean_support_card_details.py"
      - ".github/workflows/clean-support-card-details.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-support-card-details-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clean details files
        run: python tools/clean_support_card_details.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit - files already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "LilyAiGameSpace/Umamusume/Support Cards"
          git commit -m "chore: clean support card details [skip ci]"
          git push
