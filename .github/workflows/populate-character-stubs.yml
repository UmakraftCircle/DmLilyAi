name: Populate character stubs

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max files to write this run"
        default: "10"
      only:
        description: "Comma-separated file stems (e.g. Kitasan_Black,Rice_Shower). Empty = next files alphabetically"
        default: ""
      refresh:
        description: "Also regenerate files this script created earlier (hand-written profiles are never touched)"
        type: boolean
        default: false
      dry_run:
        description: "Parse and report only, do not commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: populate-character-stubs
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Populate stub profiles
        env:
          LIMIT: ${{ inputs.limit }}
          ONLY: ${{ inputs.only }}
          DRY: ${{ inputs.dry_run }}
          REFRESH: ${{ inputs.refresh }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          args=(--limit "$LIMIT")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          python .github/scripts/populate_character_stubs.py "${args[@]}"

      - name: Commit changes
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain LilyAiGameSpace/Umamusume/Character)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add LilyAiGameSpace/Umamusume/Character
            git commit -m "Populate Umamusume character stubs from GameTora"
            git push
          else
            echo "Nothing to commit."
          fi
