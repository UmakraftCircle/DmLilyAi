# One Render service = the bot, the API and the website. Its URL is the site.
services:
  - type: web
    name: lilyai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true     # the password you type into Settings on the site
      - key: LILYAI_DATA_DIR
        value: /app/data
      # uma.moe (Umamusume circle/fan tracking) - powers /api/leaderboard, check_umamoe,
      # and the background umamoe-poll job. See LilyAiCore/ExternalServices/Umamoe/.
      - key: UMAMOE_API_KEY
        sync: false            # from https://uma.moe - leaderboard/check_umamoe are disabled without it
      - key: UMAMOE_CIRCLE_IDS
        sync: false            # comma-separated circle ids to track (e.g. 12345,67890)
      - key: UMAMOE_NOTIFY_USER_ID
        sync: false            # Discord user id to DM on rank/points/fan changes; empty = log only
      - key: UMAMOE_POLL_INTERVAL_HOURS
        value: "6"
      # Turso (libSQL) - optional. Set these to persist memory/state across deploys on the
      # free plan instead of paying for a disk (see LilyAiCore/ExternalServices/Database/turso.py).
      - key: TURSO_DATABASE_URL
        sync: false            # e.g. libsql://your-db-name.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
    # The free plan has an ephemeral filesystem: memory and the RAG index reset on each deploy/restart,
    # UNLESS TURSO_DATABASE_URL/TURSO_AUTH_TOKEN are set above (memory only - the RAG index still resets).
    # Alternatively, for persistence without Turso, use a paid plan and uncomment:
    # disk:
    #   name: lilyai-data
    #   mountPath: /app/data
    #   sizeGB: 1
